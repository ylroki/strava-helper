<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="40" fill="#FC4C02"/>

  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="88" cy="160" r="44" fill="none" stroke="white" stroke-width="10"/>
  <!-- Front wheel -->
  <circle cx="180" cy="160" r="44" fill="none" stroke="white" stroke-width="10"/>

  <!-- Frame: chainstay (rear axle to bottom bracket) -->
  <line x1="88" y1="160" x2="128" y2="128" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Frame: seat tube (bottom bracket to seat) -->
  <line x1="128" y1="128" x2="116" y2="88" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Frame: top tube (seat to head tube) -->
  <line x1="116" y1="88" x2="160" y2="96" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Frame: down tube (bottom bracket to front fork) -->
  <line x1="128" y1="128" x2="180" y2="160" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Frame: fork (head tube to front axle) -->
  <line x1="160" y1="96" x2="180" y2="160" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="152" y1="88" x2="172" y2="88" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="162" y1="88" x2="160" y2="96" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Seat -->
  <line x1="104" y1="82" x2="126" y2="82" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="116" y1="82" x2="116" y2="88" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Bottom bracket / pedal crank -->
  <circle cx="128" cy="128" r="7" fill="white"/>
</svg>
